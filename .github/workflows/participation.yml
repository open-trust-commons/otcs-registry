# The trigger the destination depends on, watched by a machine.
#
# CHARTER.md §7's stage-2 trigger is sustained public participation, and issue
# #14 resolved that it is COMPUTED rather than noticed — the founder cannot be
# the party who decides whether it fired, cannot fail to notice, and cannot
# delay noticing. A recompute that only ran when someone remembered would put
# the noticing back in a person's hands. So it runs nightly, like standing.
#
# Advisory. It never fails the build, never edits a record, and appoints
# nobody. It reports each actor's public trail against the published bar.
name: participation
on:
  schedule:
    - cron: '43 9 * * *'   # daily, off the hour, offset from standing's 09:17
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: participation
  cancel-in-progress: false
jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      - name: Recompute each actor's public trail
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run participation | tee /tmp/participation.txt
      - name: Commit the log to the participation-log branch
        # Same pattern as standing.yml, same reason: main refuses bot commits
        # (GH013), so the log lives on an unprotected data branch and main's
        # copy advances when the maintainer's own runs commit it. And the same
        # fix as standing.yml: the recompute appended today's entry to main's
        # copy, so carry that entry over to the branch tip rather than
        # rebuilding the branch from main — rebuilding is what made every push
        # after the first non-fast-forward once main advanced.
        run: |
          git config user.name  "otcs-participation"
          git config user.email "kinetic-trust@proton.me"
          git show HEAD:computed/participation-log.jsonl > /tmp/log-at-head.jsonl 2>/dev/null || : > /tmp/log-at-head.jsonl
          tail -n +"$(( $(wc -l < /tmp/log-at-head.jsonl) + 1 ))" computed/participation-log.jsonl > /tmp/new-entries.jsonl
          if ! [ -s /tmp/new-entries.jsonl ]; then
            echo "no change to the participation log"
            exit 0
          fi
          git checkout -- computed/participation-log.jsonl
          if git fetch origin participation-log 2>/dev/null; then
            git checkout -B participation-log FETCH_HEAD
          else
            git checkout -B participation-log
          fi
          cat /tmp/new-entries.jsonl >> computed/participation-log.jsonl
          git add computed/participation-log.jsonl
          git commit -m "participation: nightly recompute $(date -u +%Y-%m-%d)"
          git push origin participation-log
      - name: Summary
        run: cat /tmp/participation.txt >> "$GITHUB_STEP_SUMMARY"
