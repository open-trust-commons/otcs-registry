name: Documentation problem
description: Something is unclear, wrong, broken, or missing in the docs.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes: { label: Page or file }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: What went wrong }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: "If you tried to do something and could not, say what you were trying to do. That is the most useful documentation report there is."
