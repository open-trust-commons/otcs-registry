  maintainers:
    - name: Chris Perkins (nmcitra)
      representative: true
declaration:
  problem: >
    Measures an organization's ambiguity load against its resolution capacity
    (rho = Z/mu) and locates the operating zone, supplying environmental state
    and repair-capacity measurements that action-governance systems can consume.
  governed_object: [environment]
  primary_users: [operations leaders, governance systems]
  threat_or_failure_model: >
    Saturation: unresolved ambiguity arriving faster than resolution capacity,
    degrading the environment's ability to support autonomous action.
  evidence_outputs: [zone measurements, saturation indicators]
  known_limitations: >
    Measurement model with first published results; instrumentation is manual;
    no independent replication yet; calibration is organization-specific.
