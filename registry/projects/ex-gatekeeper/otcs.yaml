otcs_version: "0.1"
project:
  id: ex-gatekeeper
  name: Example Gatekeeper (fictional)
  status: prototype
  first_public_date: "2026-01-01"
  license: Apache-2.0
  record_state: example
  maintainers: [{ name: Example Maintainer }]
declaration:
  problem: >
    Fictional demonstration record: an enforcement gateway that executes, shapes,
    or contains actions per decisions it consumes from a decision system.
  governed_object: [action]
  decision_outputs: [ALLOW, SHAPE, VETO]
  enforcement_points: [edge gateway]
  evidence_outputs: [gateway receipts]
  known_limitations: Fictional demonstration record. Implements nothing.
coordinates:
  actor: { service: 1.0, ai_agent: 0.8 }
  authority: [credential, capability]
  verbs: [execute, transfer, send]
  environment: [system_health]
  functions: { enforce: 0.9, record: 0.5 }
  time: [initiation, during_action, commit_point]
evidence: { specification: 1, implementation: 1, independent_validation: 0 }
interfaces:
  provides: [receipt]
  consumes: [decision]
