declaration:
  problem: >
    This record exists for exactly one purpose: to exercise the registration
    lifecycle mechanism end to end (registered, ownership transfer, correction,
    withdrawal) against real tooling, for the v1.0 governance and sovereignty
    criteria that require the mechanism be demonstrated. It describes no real
    system and addresses no real problem.
  governed_object: [institutional_process]
  primary_users: []
  threat_or_failure_model: >
    None. This is a process fixture, not a governed system.
  decision_outputs: []
  enforcement_points: []
  evidence_outputs: []
  known_limitations: >
    This is not a real project and never was. It has no canonical public
    artifact, no substantive claim about any real system, and must never be
    counted as a qualifying active project under QUALIFYING-PROJECTS.md - it
    is disqualified by construction (no canonical artifact, no evidence
    record) so that it cannot accidentally inflate any count even if this
    note is later lost.


    CORRECTION (2026-08-01, record_version 3): `coordinates.functions.record`
    and `declaration.governed_object: [institutional_process]` were set only
    to satisfy schema minimums (functions requires minProperties 1;
    governed_object requires minItems 1), not because this fixture actually
    governs anything. That distinction - a value present to satisfy the
    schema versus a value asserting something true - is exactly the kind of
    gap EVIDENCE-MODEL.md §4b exists to name, and this fixture had fallen
    into it. Corrected here as a new statement rather than a silent edit,
    per this project's own rule that a correction is added, not quietly
    fixed.
  non_claims:
    - "Not a real project, system, or piece of software"
    - "Not intended to remain registered — created to demonstrate withdrawal"
    - "Never eligible to count as a qualifying active project"
