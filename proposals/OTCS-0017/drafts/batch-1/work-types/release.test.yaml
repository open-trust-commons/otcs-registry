work_type:
  id: otcs-work:release.test
  label: test a release
  maps_to: [execute, read]
  roles:
    configurator: [human]
    executor: [human, ai_agent]
    effect_verifier: human
    acceptor: [human]
  mandate:
    required_before_fan_out: false
    fan_out: bounded
  consequence_ceiling: recommend
  composed_of: []
  refusal_points:
    - can_refuse: [scope]
      constructability: COMMIT_GATED
    - can_refuse: [path]
      constructability: COMMIT_GATED
  requires:
    authority: [role]
    environment: [ambiguity_load, uncertainty, human_availability]
    time: [before_action, after_action]
    maximum_unobserved_interval: no longer than the time remaining on the case's authority_validity.valid_until
    evidence_efficacy: EVIDENCE_TO_DECISION   # at least
    decision_outputs: [ALLOW, SHAPE, DEAUTOMATE, VETO]
  basis: independent_descriptions   # 4 recorded in the source pack; citations are attached in the batch proposal
notes: >
  OTCS candidate; checked for overlap against the sweep.
  Requires block from the batch defaults for ceiling recommend, class group governance (G3 Q7).
  Refusal-point qualifiers from the source: path: production data and systems.
crosswalk: >
  Native points named in the source: test environment boundary (policy_engine).
