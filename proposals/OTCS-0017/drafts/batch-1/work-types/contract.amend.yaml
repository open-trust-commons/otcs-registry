# Source: the Mission Join pack (the author's own work, invented organization), AI-assisted; see ../README.md.
work_type:
  id: otcs-work:contract.amend
  label: Change the terms, scope or value of an existing agreement
  maps_to: [bind, write]
  roles:
    configurator: [human]
    executor: [human]
    effect_verifier: human
    acceptor: [human]
  mandate:
    required_before_fan_out: true
    fan_out: none
  consequence_ceiling: mutate
  composed_of: []
  refusal_points:
    - can_refuse: [mandate]
      constructability: COMMIT_GATED
    - can_refuse: [consequence]
      constructability: COMMIT_GATED
  requires:
    authority: [contract, mandate, organizational_policy, role]
    environment: [downstream_capacity, financial_exposure, legal_context, reversibility, system_health]
    time: [before_action, commit_point, after_action, repair_window]
    maximum_unobserved_interval: no longer than the time remaining on the mandate's authority_validity.valid_until
    evidence_efficacy: EVIDENCE_TO_DECISION   # at least
    decision_outputs: [ALLOW, SHAPE, DEAUTOMATE, VETO]
  basis: independent_descriptions   # 3 recorded in the source pack; citations are attached in the batch proposal
notes: >
  Changes binding terms; the signing-authority matrix refuses it.
  Requires block from the batch defaults for ceiling mutate, class group finance (G3 Q7).
  Refusal-point qualifiers from the source: mandate: change value; consequence: for construction.
crosswalk: >
  Native points named in the source: signing-authority matrix (policy_engine); legal review (human_approver); change-order board (human_approver).
