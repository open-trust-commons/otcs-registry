# Batch 1 material (OTCS-0017 §6). Values are the author's proposal for deliberation and may change.
# Source: the Mission Join pack (the author's own work, invented organization), AI-assisted; see ../README.md.
work_type:
  id: otcs-work:campaign.launch
  label: Start, change or halt a marketing campaign to a target audience
  maps_to: [publish, send]
  roles:
    configurator: [human]
    executor: [human, ai_agent]
    effect_verifier: human
    acceptor: [human]
  mandate:
    required_before_fan_out: false
    fan_out: open
  consequence_ceiling: mutate
  composed_of: []
  refusal_points:
    - can_refuse: [consequence]
      constructability: COMMIT_GATED
    - can_refuse: [scope]
      constructability: COMMIT_GATED
    - can_refuse: [path]
      constructability: COMMIT_GATED
    - can_refuse: [continuation]
      constructability: COMMIT_GATED
  requires:
    authority: [role, organizational_policy]
    environment: [reversibility, system_health, downstream_capacity]
    time: [before_action, commit_point, after_action, repair_window]
    maximum_unobserved_interval: no longer than the time remaining on the change window granted in authority_validity.valid_until
    evidence_efficacy: EVIDENCE_TO_DECISION   # at least
    decision_outputs: [ALLOW, SHAPE, DEAUTOMATE, VETO]
  basis: independent_descriptions   # 2 recorded in the source pack; citations are attached in the batch proposal
notes: >
  The label bundles start and halt. Halting is containment at a different ceiling, so take it out of the label.
  Requires block from the batch defaults for ceiling mutate, class group governance (G3 Q7).
  Refusal-point qualifiers from the source: consequence: creative; scope: audience.
crosswalk: >
  Native points named in the source: brand and legal approval (human_approver); consent register (policy_engine); sending platform (gateway).
