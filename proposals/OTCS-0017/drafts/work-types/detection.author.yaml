# DRAFT — not ratified. OTCS-0017 governs; this file is not part of its pinned text.
# Values are the author's proposal for deliberation and may change.
work_type:
  id: otcs-work:detection.author
  label: author a detection
  maps_to: [write]
  roles:
    configurator: [human]
    executor: [human, ai_agent]
    effect_verifier: [human]
    acceptor: [human]
  mandate:
    required_before_fan_out: false
    fan_out: none
  consequence_ceiling: mutate
  composed_of: []
  refusal_points:
    - can_refuse: [scope]
      constructability: COMMIT_GATED
    - can_refuse: [consequence]
      constructability: COMMIT_GATED
    - can_refuse: [continuation]
      constructability: COMMIT_GATED
  requires:
    authority: [role, organizational_policy]
    environment: [reversibility, data_quality, uncertainty]
    time: [before_action, commit_point, after_action, repair_window]
    maximum_unobserved_interval: no longer than the change window granted in authority_validity.valid_until
    evidence_efficacy: EVIDENCE_TO_DECISION   # at least
    decision_outputs: [ALLOW, SHAPE, DEAUTOMATE, VETO]
  basis: single_description
notes: >
  Promotion to production is a separate act by a person; the ceiling covers non-production work. Execution evidence is a version record issued by the content store, not by the author. Rollback returns the detection to its prior version.
crosswalk: >
  CACAO playbook type 'detection'; D3FEND tactic Detect; STIX Indicator
