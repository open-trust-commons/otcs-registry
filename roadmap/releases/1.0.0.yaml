version: "1.0.0"
name: "Stable Commons Contract"
status: planned
commons_stage_required: C2
criteria:
  ecosystem:
    qualifying_active_projects: { minimum: 10, sustained_days: 90, state: unmet }
    independent_stewards:       { minimum: 7,  state: unmet }
    project_classes:            { minimum: 4,  state: unmet }
  technical:
    # `authority-artifact` was never built - no such schema exists in schemas/.
    # Dropped rather than left as a criterion this repository can never meet.
    # If an authority-artifact schema is later designed, it re-enters here.
    # "Stable" is a forward promise VERSIONING.md makes AT v1.0.0, not a fact
    # about the past - so this cannot honestly read "met" by inspecting commit
    # history. It is met when a proposal explicitly freezes these four against
    # further breaking change before the v1.0.0 tag, i.e. the promise is made
    # BEFORE the tag rather than asserted BY it.
    # 2026-08-01 assessment: NOT close to freezable. analysis.schema.json
    # received two real corrections in this same session - relationship_state
    # was unconditionally required on every finding (meaningless for a
    # single-subject project_baseline) and skeptical_review was required
    # array-wide via a `contains` check instead of per-item - both found by
    # actually publishing records against the schema for the first time,
    # not by inspection. Freezing today would freeze defects discovered
    # today. A freeze proposal needs a bake period first: a stretch of real
    # use producing no correction, not merely no complaints.
    stable_schemas: { required: [project-manifest, relationship, claim, analysis],
      met_when: "a ratified proposal declares these four frozen pending v1.0.0, opened only after a bake period with zero corrections",
      bake_period_started: "2026-08-01",
      last_correction: "2026-08-01",
      state: in_progress }
    deterministic_dual_host_build: { required: true, state: unmet }
    signed_release_and_doi: { required: true, state: unmet }
    # Renamed from migration_tooling_from_0_9. That name predates the version
    # realignment (0.1 -> 0.9 -> 1.0 collapsed; ROADMAP-CHANGES.md v0.1.0
    # entry) and cited a version that no longer exists in the public arc.
    # The intent survives: a migration entry's own verification and backout
    # commands must actually run, not just be prose in MIGRATIONS.md.
    migration_tooling_verified: { required: true, state: unmet }
  evidence_and_interop:
    mutually_confirmed_relationships: { minimum: 10, state: unmet }
    # Demonstrated on registry/projects/lifecycle-fixture, a disclosed process
    # fixture created for exactly this purpose and structurally disqualified
    # from ever counting as a qualifying project (no canonical artifact, no
    # evidence record) - not on a real stakeholder. Stated plainly rather
    # than left to be inferred: a real-participant exercise is stronger
    # evidence than this, and remains open.
    completed_provenance_lifecycles:  { minimum: 1,  state: met,
      evidence: ["registry/projects/lifecycle-fixture/otcs.yaml",
                 "governance-log/events.jsonl#ev-000029..ev-000032"] }
    interfaces_with_two_independent_implementations: { minimum: 1, state: unmet }
    independently_reproduced_results: { minimum: 1, state: unmet }
    published_failures_or_negative_results: { minimum: 1, state: met,
      evidence: ["analysis/projects/ktp/v1/baseline.json"] }
  governance:
    maintainers: { minimum: 2, state: unmet }
    non_founder_maintainers: { minimum: 1, state: unmet }
    completed_trajectory_proposals: { minimum: 1, state: unmet }
    # Same caveat as completed_provenance_lifecycles above: exercised on the
    # disclosed lifecycle-fixture record, not a real stakeholder.
    correction_withdrawal_or_transfer_exercised: { required: true, state: met,
      evidence: ["registry/projects/lifecycle-fixture/otcs.yaml"] }
    # ROADMAP's third v1.0 claim is "someone else can run it". Writing the
    # instructions and having them followed are two claims; only the second
    # one is evidence. Satisfied by a signed handover record, not by the
    # existence of RUNBOOK.md.
    runbook_followed_by_non_founder: { required: true, state: unmet }
    process_validity_separated_from_vote_total: { required: true, state: met,
      evidence: ["proposals/OTCS-0000/decision.json"] }
  # ── Sovereignty ──────────────────────────────────────────────────────
  #
  # The constitutional claim is one sentence: NO SYSTEM MUST SURRENDER ITS
  # IDENTITY IN ORDER TO COORDINATE.
  #
  # Everything above this block counts things. These test whether that
  # sentence is true. A registry can reach every count and still quietly
  # become the parent architecture of everything it lists, which is the
  # failure this project would least be able to see from the inside.
  #
  # Each is binary and each is currently false.
  sovereignty:
    # Identity does not depend on being indexed here.
    self_hosted_manifest_resolved: { required: true, state: unmet }
    identity_survives_deindexing: { required: true, state: unmet }

    # A project may reject how it was described and lose nothing.
    mapping_disputed_by_owner: { required: true, state: unmet }
    disputed_record_remains_complete_and_prominent: { required: true, state: unmet }

    # The site is replaceable. Two implementations agree on identities,
    # hashes, versions, relationship states and evidence states.
    second_independent_implementation_agrees: { required: true, state: unmet }

    # Two systems with different architectures compose, and the composition
    # is a third artifact neither parent owns alone.
    composition_without_absorption: { required: true, state: unmet }

    # An attempted composition that could NOT be completed is published,
    # with the reason preserved. A system that always finds a crosswalk is
    # not measuring anything.
    published_non_composition: { required: true, state: met,
      evidence: ["analysis/pairs/ktp--tcp-congestion-control/v1/composition-attempt.json"] }

    # A project leaves. History and provenance survive; active claims stop;
    # no other project loses identity.
    exit_exercised_without_collateral_loss: { required: true, state: unmet }

    # The hardest one. A project whose architecture centres on something
    # other than these coordinates is represented IN ITS OWN WORDS, with a
    # separate OTCS analysis alongside, and its steward confirms, qualifies
    # or disputes that analysis. Passing means the vocabulary described a
    # foreign architecture without converting it into KTP or treating it as
    # a subordinate implementation.
    foreign_architecture_represented_natively: { required: true, state: unmet }

  security:
    independent_security_review: { required: true, state: unmet }
    # Deliberately not exercised live during the 2026-08-01 DR pass. That
    # exercise found no offline backup of the current key exists (see
    # INCIDENT-RESPONSE.md §9) - drilling a rotation before a backup exists
    # is the wrong order: a mistake mid-drill could lose signing entirely
    # with nothing to fall back to. Rotating the maintainer's live,
    # published key is also an irreversible, outward-facing action; the
    # published fingerprint is already quoted in unsent draft replies to
    # three prospective registrants, so a rotation right now would
    # invalidate text nobody has seen yet for no operational reason.
    # Correct order: back up the current key offline, THEN drill rotation.
    key_rotation_tested: { required: true, state: unmet }
    disaster_recovery_restoration_tested: { required: true, state: met,
      evidence: ["INCIDENT-RESPONSE.md#9-restoration-tested"] }
    unresolved_critical_findings: { maximum: 0, state: met }
